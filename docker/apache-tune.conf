ServerTokens Prod
ServerSignature Off
TraceEnable Off

KeepAlive On
KeepAliveTimeout 3
MaxKeepAliveRequests 100
Timeout 60

<IfModule mpm_prefork_module>
    StartServers             2
    MinSpareServers          2
    MaxSpareServers          4
    MaxRequestWorkers        12
    MaxConnectionsPerChild   500
</IfModule>

SetEnvIf X-Forwarded-Proto "https" HTTPS=on
ServerName localhost
LogFormat "%{%H:%M:%S}t %>s %m %U%q %{ms}Tms" combined