date.timezone = Asia/Tehran
memory_limit = 192M
upload_max_filesize = 20M
post_max_size = 25M
max_execution_time = 60
expose_php = Off
display_errors = Off
log_errors = On

opcache.enable = 1
opcache.memory_consumption = 64
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
