server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location ~* \.(js|css|ttf|otf|woff|woff2|eot|svg|png|jpe?g|webp|gif|ico)$ {
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location ~ \.php$ {
        return 404;
    }

    location / {
        add_header Access-Control-Allow-Origin "*";
        try_files $uri $uri/ =404;
    }
}
